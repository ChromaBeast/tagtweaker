name: tag_tweaker
description: >-
  Product catalog and client quotation tool for retailers: browse inventory,
  tweak prices per client, apply pricing rules and export branded PDF quotes.
publish_to: 'none'

version: 1.2.0+3

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter

  # State management & routing
  get: ^4.7.3

  # Firebase
  firebase_core: ^4.4.0
  firebase_auth: ^6.1.4
  cloud_firestore: ^6.1.2
  firebase_storage: ^13.0.6
  firebase_app_check: ^0.4.1+2
  google_sign_in: ^7.2.0

  # PDF generation & sharing
  pdf: ^3.13.1
  printing: ^5.15.0
  path_provider: ^2.1.5
  share_plus: ^13.3.0

  # Networking & media
  http: ^1.6.0
  cached_network_image: ^4.0.0
  image_picker: ^1.2.1

  # UI
  cupertino_icons: ^1.0.8
  carousel_slider: ^5.1.1
  google_fonts: ^8.2.1
  flutter_animate: ^4.5.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_cloud_firestore: ^4.4.0
  firebase_auth_mocks: ^0.15.2

flutter:
  uses-material-design: true
  assets:
    - assets/animations/
    - assets/icons/
    - assets/categories/
    - assets/images/
