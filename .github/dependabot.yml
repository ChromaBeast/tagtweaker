version: 2
updates:
  - package-ecosystem: pub
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      firebase:
        patterns: ['firebase_*', 'cloud_firestore', 'fake_cloud_firestore']

  - package-ecosystem: npm
    directory: /test_rules
    schedule:
      interval: monthly
    groups:
      firebase-tooling:
        patterns: ['*']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
